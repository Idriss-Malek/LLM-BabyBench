env:
  env_name: BabyAI-GoToObj-v0
  seed: 43
eval:
  evaluator: predict
  task: predict
inputs:
  formatter: structured
  processor: omniscient_babyai_bot
  prompter: zero_shot
llm:
  max_tokens: 2048
  model: gpt-5.4
  name: openai
  reasoning_effort: medium
  system_prompt: ''
  temperature: 0.0
output:
  log_every: 10
  path: results/openai_gpt-5.4_GoToObj_predict_zero_shot_structured_seed43_effortmedium.json
  save_prompts: true
  save_raw_llm_output: true
