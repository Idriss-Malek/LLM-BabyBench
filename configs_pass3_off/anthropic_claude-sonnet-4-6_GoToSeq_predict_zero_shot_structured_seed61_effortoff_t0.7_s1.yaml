env:
  env_name: BabyAI-GoToSeq-v0
  seed: 61
eval:
  evaluator: predict
  task: predict
inputs:
  formatter: structured
  processor: omniscient_babyai_bot
  prompter: zero_shot
llm:
  max_tokens: 8192
  model: claude-sonnet-4-6
  name: anthropic
  reasoning_effort: 'off'
  system_prompt: ''
  temperature: 0.7
output:
  log_every: 10
  path: results/anthropic_claude-sonnet-4-6_GoToSeq_predict_zero_shot_structured_seed61_effortoff_t0.7_s1.json
  save_prompts: true
  save_raw_llm_output: true
