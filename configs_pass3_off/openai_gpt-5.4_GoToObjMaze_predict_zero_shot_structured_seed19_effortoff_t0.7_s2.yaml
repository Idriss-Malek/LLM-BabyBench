env:
  env_name: BabyAI-GoToObjMaze-v0
  seed: 19
eval:
  evaluator: predict
  task: predict
inputs:
  formatter: structured
  processor: omniscient_babyai_bot
  prompter: zero_shot
llm:
  max_tokens: 4096
  model: gpt-5.4
  name: openai
  reasoning_effort: 'off'
  system_prompt: ''
  temperature: 0.7
output:
  log_every: 10
  path: results/openai_gpt-5.4_GoToObjMaze_predict_zero_shot_structured_seed19_effortoff_t0.7_s2.json
  save_prompts: true
  save_raw_llm_output: true
