env:
  env_name: BabyAI-GoToObj-v0
  seed: 17
eval:
  evaluator: predict
  task: predict
inputs:
  formatter: structured
  processor: omniscient_babyai_bot
  prompter: zero_shot
llm:
  max_tokens: 2048
  model: claude-opus-4-6
  name: anthropic
  reasoning_effort: 'off'
  system_prompt: ''
  temperature: 0.0
output:
  log_every: 10
  path: results/anthropic_claude-opus-4-6_GoToObj_predict_zero_shot_structured_seed17_effortoff.json
  save_prompts: true
  save_raw_llm_output: true
