env:
  env_name: BabyAI-GoToSeq-v0
  seed: 23
eval:
  evaluator: decompose
  task: decompose
inputs:
  formatter: structured
  processor: omniscient_babyai_bot
  prompter: zero_shot
llm:
  max_tokens: 8192
  model: gpt-5.4
  name: openai
  reasoning_effort: high
  system_prompt: ''
  temperature: 0.0
output:
  log_every: 10
  path: results/openai_gpt-5.4_GoToSeq_decompose_zero_shot_structured_seed23_efforthigh.json
  save_prompts: true
  save_raw_llm_output: true
