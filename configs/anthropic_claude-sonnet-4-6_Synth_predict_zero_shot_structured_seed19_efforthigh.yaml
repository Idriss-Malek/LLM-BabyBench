env:
  env_name: BabyAI-Synth-v0
  seed: 19
eval:
  evaluator: predict
  task: predict
inputs:
  formatter: structured
  processor: omniscient_babyai_bot
  prompter: zero_shot
llm:
  max_tokens: 8192
  model: claude-sonnet-4-6
  name: anthropic
  reasoning_effort: high
  system_prompt: ''
  temperature: 0.0
output:
  log_every: 10
  path: results/anthropic_claude-sonnet-4-6_Synth_predict_zero_shot_structured_seed19_efforthigh.json
  save_prompts: true
  save_raw_llm_output: true
