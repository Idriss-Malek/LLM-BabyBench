env:
  env_name: BabyAI-SynthSeq-v0
  seed: 37
eval:
  evaluator: predict
  task: predict
inputs:
  formatter: structured
  processor: omniscient_babyai_bot
  prompter: zero_shot
llm:
  max_tokens: 8192
  model: gpt-5.4
  name: openai
  reasoning_effort: low
  system_prompt: ''
  temperature: 0.0
output:
  log_every: 10
  path: results/openai_gpt-5.4_SynthSeq_predict_zero_shot_structured_seed37_effortlow.json
  save_prompts: true
  save_raw_llm_output: true
